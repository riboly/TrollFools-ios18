name: Compile

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  THEOS: ""
  VERSION: "0.0.0-0"

jobs:
  fetch-and-release:
    runs-on: macos-14
    steps:
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Checkout Repository
        uses: actions/checkout@v4.1.1

      - name: Install Dependencies
        run: |
          echo /usr/local/opt/make/libexec/gnubin >> $GITHUB_PATH
          echo /opt/homebrew/opt/make/libexec/gnubin >> $GITHUB_PATH
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1 brew install dpkg ldid-procursus make xcbeautify openssl@3
          VERSION_FILE="TrollFools/Version.xcconfig"
          VERSION_MAIN=$(grep "VERSION" $VERSION_FILE | cut -d'=' -f2 | tr -d '[:space:]')
          VERSION_BUILD=$(grep "BUILD_NUMBER" $VERSION_FILE | cut -d'=' -f2 | tr -d '[:space:]')
          VERSION=$VERSION_MAIN-$VERSION_BUILD
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version: $VERSION"

      - name: Checkout THEOS
        uses: actions/checkout@v4.1.1
        with:
          repository: theos/theos
          ref: 942cd0c015f93d8c2d714ba0c69e7f420157c382
          path: theos
          submodules: recursive

      - name: Add THEOS environment variables
        run: |
          rm -rf $GITHUB_WORKSPACE/theos/sdks
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV
          echo "THEOS_PACKAGE_SCHEME=rootless" >> $GITHUB_ENV
          echo "FINALPACKAGE=1" >> $GITHUB_ENV

      - name: Checkout SDKs
        uses: actions/checkout@v4.1.1
        with:
          repository: theos/sdks
          ref: master
          path: ${{ env.THEOS }}/sdks

      - name: Build Packages
        run: |
          make package
          cp packages/*.tipa packages/*.deb .
          bash devkit/collect-dsyms.sh .theos/obj .

      - name: Validate Deferred Loader
        run: |
          VALIDATION_DIR=$(mktemp -d)
          unzip -q TrollFools_*.tipa -d "$VALIDATION_DIR"
          LOADER="$VALIDATION_DIR/Payload/TrollFools.app/TrollFoolsLoader.dylib"
          test -x "$LOADER"
          lipo "$LOADER" -verify_arch arm64 arm64e
          otool -D "$LOADER" | grep -q '@rpath/TrollFoolsLoader.dylib'
          otool -l "$LOADER" | grep -q '__interpose'
          strings "$LOADER" | grep -q 'Guarded %lu reentrant UIKit setter hook(s)'
          lipo TrollFoolsLoader.dylib.dSYM/Contents/Resources/DWARF/TrollFoolsLoader.dylib \
            -verify_arch arm64 arm64e
          lipo TrollFoolsTweak.dylib.dSYM/Contents/Resources/DWARF/TrollFoolsTweak.dylib \
            -verify_arch arm64 arm64e
          ! dpkg-deb --contents wiki.qaq.trollfools.l_*.deb \
            | grep -Eq '[.]/(var/jb/)?usr/local/lib/TrollFoolsLoader[.]dylib$'

      - name: Upload Packages
        uses: actions/upload-artifact@v4
        with:
          name: TrollFools-iOS18-${{ env.VERSION }}
          if-no-files-found: error
          path: |
            *.tipa
            *.deb
            *.dSYM
